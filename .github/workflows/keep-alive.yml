name: Keep Codespace Active 24/7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GitHub Codespaces API
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          CODESPACE_NAME: ${{ secrets.CODESPACE_NAME }}
        run: |
          if [ -z "$GH_PAT" ] || [ -z "$CODESPACE_NAME" ]; then
            echo "[ERROR]: GH_PAT or CODESPACE_NAME secret is missing!"
            exit 1
          fi
          echo "Sending keep-alive ping to Codespace: $CODESPACE_NAME..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/codespaces/$CODESPACE_NAME/start)
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Response Code: $HTTP_STATUS"
          echo "Response Body:"
          echo "$BODY"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 202 ]; then
            echo "[SUCCESS]: Keep-alive ping accepted! Codespace active."
          else
            echo "[WARNING]: Unexpected HTTP status $HTTP_STATUS."
          fi
